# Publish the Lumen documentation at https://aeonthic.com/docs/lumen/<document>.
# Enable this site after the aeonthic.com certificate has been issued:
#   sudo a2ensite aeonthic-docs && sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName aeonthic.com
    DocumentRoot /var/www/html

    Alias /docs/ /mnt/openwebui/www/html/docs/
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/

    <Directory /mnt/openwebui/www/html/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/docs/
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://aeonthic.com/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/aeonthic-docs-error.log
    CustomLog ${APACHE_LOG_DIR}/aeonthic-docs-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName aeonthic.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/aeonthic.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/aeonthic.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    AliasMatch ^/docs/lumen/(product-information|tool-use-and-files|web-search-and-citations|citations-and-copyright|prompting-guide|safety-and-wellbeing|aeonthic-chat-deployment)/?$ /mnt/openwebui/www/html/docs/lumen/$1.md

    Alias /docs/ /mnt/openwebui/www/html/docs/

    <Directory /mnt/openwebui/www/html/docs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    AddType text/markdown .md
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "public, max-age=300"


    ErrorLog ${APACHE_LOG_DIR}/aeonthic-docs-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/aeonthic-docs-ssl-access.log combined
</VirtualHost>
</IfModule>
